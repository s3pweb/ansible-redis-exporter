---

- name: REDIS_EXPORTER | Install
  include_tasks: install.yml
  tags:
    - install

- name: REDIS_EXPORTER | Configure
  include_tasks: config.yml
  with_dict: "{{ redis_databases }}"
  loop_control:
    loop_var: rd_item
  tags:
    - configure

- name: REDIS_EXPORTER | Service
  include_tasks: service.yml
  with_dict: "{{ redis_databases }}"
  loop_control:
    loop_var: rd_item
  tags:
    - service
